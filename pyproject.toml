[project]
name = "novel-selector"
version = "0.1.0"
description = "CLI novel recommender powered by Legado book sources and an OpenAI-compatible LLM."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "httpx>=0.27.2",
    "jsonpath-ng>=1.6.1",
    "lxml>=5.3.0",
    "openai>=1.54.0",
    "prompt-toolkit>=3.0.48",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
]

[project.scripts]
novel-selector = "novel_selector.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
